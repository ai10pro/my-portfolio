<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ぺんぎんのポートフォリオ | 作品集</title>
    <meta name="description" content="とある情報系高専生のポートフォリオです。" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css" />

  </head>
  <body>
    <header>
      <div class="header_inner">
        <a href="../index.html">
          <h1 class="title-logo">ぺんぎん</h1>
        </a>
        <nav class="gnav">
          <ul class="gnav-list">
            <li><a href="./works.html">Works</a></li>
            <li><a href="./skills.html">Skills</a></li>
            <li><a href="https://x.com/ai10pro">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="works_t_section">
        <h1>Works</h1>
        <p>過去の作品集</p>
      </div>
      <div class="works-list" id="works-list"></div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-content" id="modal-content">
        <button class="modal-close" id="modal-close">×</button>
        <div class="modal-media">
          <div class="modal-media-viewer" id="modal-media-viewer"></div>
          <div class="modal-media-nav" id="modal-media-nav">
            <button id="media-prev">‹</button>
            <span id="media-counter"></span>
            <button id="media-next">›</button>
          </div>
        </div>
        <div class="modal-info">
          <p class="modal-info-date" id="modal-date"></p>
          <h2 class="modal-info-title" id="modal-title"></h2>
          <p class="modal-info-desc" id="modal-desc"></p>
          <div class="modal-info-links" id="modal-links"></div>
          <div class="modal-info-tags" id="modal-tags"></div>
        </div>
      </div>
    </div>

    <footer>
      <p>© copyright 2023 ai10pro/ぺんぎん. all right resolved.</p>
    </footer>

    <script src="../script/works-data.js"></script>
    <script>
      let works = worksData;
      let currentMediaIndex = 0;
      let currentMediaList = [];

      renderWorks();

      function renderWorks() {
        const list = document.getElementById('works-list');
        list.innerHTML = works.map(work => `
          <div class="work-card">
            <div class="work-card-thumbnail">
              <img src="${work.thumbnail}" alt="${work.title}" loading="lazy" />
            </div>
            <div class="work-card-body">
              <p class="work-card-date">${work.date}</p>
              <h3 class="work-card-title">${work.title}</h3>
              <p class="work-card-short-desc">${work.shortDesc}</p>
              <div class="work-tags">
                ${work.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
              </div>
              <button class="view-more-btn" onclick="openModal('${work.id}')">詳細を見る</button>
            </div>
          </div>
        `).join('');
      }

      // モーダルを開く
      function openModal(id) {
        const work = works.find(w => w.id === id);
        if (!work) return;

        currentMediaList = work.media;
        currentMediaIndex = 0;

        document.getElementById('modal-date').textContent = work.date;
        document.getElementById('modal-title').textContent = work.title;
        document.getElementById('modal-desc').textContent = work.fullDesc;

        // リンク
        const linksEl = document.getElementById('modal-links');
        linksEl.innerHTML = work.links.map(link =>
          `<a href="${link.url}" target="_blank" rel="noopener">↗ ${link.label}</a>`
        ).join('');

        // タグ
        const tagsEl = document.getElementById('modal-tags');
        tagsEl.innerHTML = work.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

        // メディア
        renderModalMedia();

        // ナビゲーション（1件のみの場合は非表示）
        document.getElementById('modal-media-nav').style.display =
          currentMediaList.length > 1 ? 'flex' : 'none';

        document.getElementById('modal-overlay').classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function renderModalMedia() {
        const viewer = document.getElementById('modal-media-viewer');
        const src = currentMediaList[currentMediaIndex];
        const isVideo = src.endsWith('.mp4') || src.endsWith('.webm');

        viewer.innerHTML = isVideo
          ? `<video src="${src}" controls autoplay muted></video>`
          : `<img src="${src}" alt="メディア" />`;

        document.getElementById('media-counter').textContent =
          `${currentMediaIndex + 1} / ${currentMediaList.length}`;
        document.getElementById('media-prev').disabled = currentMediaIndex === 0;
        document.getElementById('media-next').disabled = currentMediaIndex === currentMediaList.length - 1;
      }

      // モーダルを閉じる
      function closeModal() {
        document.getElementById('modal-overlay').classList.remove('active');
        document.body.style.overflow = '';
      }

      // メディアナビ
      document.getElementById('media-prev').addEventListener('click', () => {
        if (currentMediaIndex > 0) {
          currentMediaIndex--;
          renderModalMedia();
        }
      });

      document.getElementById('media-next').addEventListener('click', () => {
        if (currentMediaIndex < currentMediaList.length - 1) {
          currentMediaIndex++;
          renderModalMedia();
        }
      });

      // オーバーレイ外クリックで閉じる
      document.getElementById('modal-overlay').addEventListener('click', e => {
        if (e.target === document.getElementById('modal-overlay')) closeModal();
      });
      document.getElementById('modal-close').addEventListener('click', closeModal);

      // Escキーで閉じる
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
      });
    </script>
  </body>
</html>
